name: Siatka bezpieczeństwa wdrożenia

# Powód istnienia tego workflow: 2026-07-31 merge PR #37 do main nie
# wywołał builda w Cloudflare Workers Builds (potwierdzone przez
# "wrangler versions list" - brak wpisu dla tego commita). Cloudflare nie
# zgłasza statusu builda z powrotem do GitHuba, więc z poziomu repo ten
# zgubiony webhook był niewidoczny - produkcja serwowała stare treści
# przez ~10 dni, do kolejnego, niepowiązanego mergea.
#
# 2026-08-31: oba kroki czytające wersję brały `.[0]`, czyli element
# PIERWSZY, a `wrangler versions list --json` zwraca wersje rosnąco - więc
# porównywana była najstarsza wersja, ta sama przed i po. Warunek nigdy nie
# mógł się spełnić: workflow zawsze czekał pełne 4 minuty i zawsze meldował
# "Cloudflare nie wystartował", nawet gdy Cloudflare wdrożył po minucie.
# Stąd sortowanie po dacie utworzenia i branie ostatniego elementu.
#
# Ten workflow nie zastępuje integracji git Cloudflare - tylko ją
# obserwuje. Po każdym pushu do main sprawdza (do 4 minut, co 30 s), czy
# na koncie pojawiła się nowa wersja Workera. Jeśli tak - kończy się bez
# akcji. Jeśli nie - sam robi "wrangler deploy" z tym samym builda, który
# Cloudflare i tak by wykonał, więc produkcja i tak dogania main.

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  sprawdz-i-napraw:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Instalacja (zgodna z lockfile)
        run: npm ci
      - name: Build produkcyjny
        run: npm run build
      - name: Sprawdź sekrety Cloudflare
        run: |
          BRAKI=""
          [ -n "$CLOUDFLARE_API_TOKEN" ] || BRAKI="$BRAKI CLOUDFLARE_API_TOKEN"
          [ -n "$CLOUDFLARE_ACCOUNT_ID" ] || BRAKI="$BRAKI CLOUDFLARE_ACCOUNT_ID"
          if [ -n "$BRAKI" ]; then
            echo "::error::Brak sekretow:$BRAKI - ustaw je w Settings > Secrets and variables > Actions."
            echo "Bez nich ten workflow nie odczyta wersji Workera ani nie wdrozy, a czekanie"
            echo "na build Cloudflare zawsze konczy sie falszywym 'nie wystartowal'."
            exit 1
          fi
          echo "Sekrety obecne."
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Zapamiętaj najnowszą wersję Workera sprzed tego pusha
        id: przed
        run: |
          ID=$(npx wrangler versions list --name przewodnikai --json | jq -r '(sort_by(.metadata.created_on) | last | .id) // empty')
          echo "Wersja sprzed pusha: ${ID:-brak}"
          echo "id=$ID" >> "$GITHUB_OUTPUT"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Czekaj na automatyczny build Cloudflare Workers Builds
        id: czekaj
        run: |
          for i in $(seq 1 8); do
            sleep 30
            NOWY=$(npx wrangler versions list --name przewodnikai --json | jq -r '(sort_by(.metadata.created_on) | last | .id) // empty')
            if [ -n "$NOWY" ] && [ "$NOWY" != "${{ steps.przed.outputs.id }}" ]; then
              echo "Cloudflare wdrożył sam (wersja $NOWY) po $((i * 30)) s - koniec."
              echo "wdrozono=tak" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          done
          echo "Brak nowej wersji po 4 min - Cloudflare Workers Builds nie wystartował."
          echo "wdrozono=nie" >> "$GITHUB_OUTPUT"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Deploy awaryjny - Cloudflare Workers Builds nie zadziałał
        if: steps.czekaj.outputs.wdrozono == 'nie'
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
