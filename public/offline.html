<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0066ff">
<title>Brak połączenia z internetem - PrzewodnikAI.pl</title>
<style>
  * { box-sizing: border-box; }
  :root {
    --bg: #f5f5f5; --surface: #ffffff; --fg: #111111; --muted: #555555;
    --line: #e5e5e5; --accent: #0066ff; --accent-2: #0052cc;
    --on-accent: #ffffff;
  }
  body {
    margin: 0; min-height: 100vh; padding: 1.5rem;
    display: grid; place-items: center;
    line-height: 1.6; -webkit-font-smoothing: antialiased;
    background: var(--bg); color: var(--fg);
    font-family: Inter, "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  main {
    width: 100%; max-width: 27rem;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 0.625rem;
    overflow: hidden;
    box-shadow: 0 1px 2px rgba(0,0,0,.04), 0 12px 32px -12px rgba(0,0,0,.18);
  }
  .bar { height: 4px; background: linear-gradient(135deg, #0066ff 0%, #00a67e 100%); }
  .pad { padding: 2.5rem 2rem 2rem; text-align: center; }
  .wordmark {
    display: inline-block; margin: 0 0 1.75rem;
    font-size: 1.2rem; font-weight: 700; letter-spacing: -0.02em;
    color: inherit; text-decoration: none; 
  }
  .wordmark b { color: var(--accent); font-weight: 700; }
  .glyph { color: var(--accent); display: block; margin: 0 auto 1.5rem; opacity: .9; }
  h1 { font-size: 1.45rem; line-height: 1.25; margin: 0 0 0.6rem; font-family: Inter, "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; font-weight: 700; }
  .lead { margin: 0 0 1.75rem; color: var(--muted); }
  .hint {
    margin: 1.75rem 0 0; padding-top: 1.25rem;
    border-top: 1px solid var(--line);
    font-size: 0.85rem; color: var(--muted);
  }
  button {
    font: inherit; font-weight: 600; cursor: pointer; width: 100%;
    padding: 0.8rem 1.5rem; border: 0; border-radius: 0.625rem;
    background: var(--accent); color: var(--on-accent);
    transition: transform .15s ease, background-color .15s ease;
  }
  button:hover { background: var(--accent-2); }
  button:active { transform: translateY(1px); }
  button:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }
  .wordmark:focus-visible { outline: 3px solid var(--accent); outline-offset: 4px; border-radius: 4px; }
  @media (prefers-reduced-motion: reduce) {
    button { transition: none; }
    button:active { transform: none; }
  }
  @media (max-width: 26rem) {
    .pad { padding: 2rem 1.25rem 1.5rem; }
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0d0d0d; --surface: #171717; --fg: #ededed; --muted: #a1a1a1;
      --line: #2a2a2a; --accent: #4d94ff; --accent-2: #0066ff;
      --on-accent: #0d0d0d;
    }
    .bar { background: linear-gradient(135deg, #4d94ff 0%, #22c79c 100%); }
    main { box-shadow: none; }
  }

</style>
</head>
<body>
  <main>
    <div class="bar" aria-hidden="true"></div>
    <div class="pad">
      <a class="wordmark" href="/">Przewodnik<b>AI</b>.pl</a>
      <svg class="glyph" viewBox="0 0 24 24" width="52" height="52" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M1 1l22 22"/><path d="M16.72 11.06A10.94 10.94 0 0 1 19 12.55"/><path d="M5 12.55a10.94 10.94 0 0 1 5.17-2.39"/><path d="M10.71 5.05A16 16 0 0 1 22.58 9"/><path d="M1.42 9a15.91 15.91 0 0 1 4.7-2.88"/><path d="M8.53 16.11a6 6 0 0 1 6.95 0"/><path d="M12 20h.01"/></svg>
      <h1>Brak połączenia z internetem</h1>
      <p class="lead">Wygląda na to, że połączenie zostało przerwane. Sprawdź Wi-Fi albo dane komórkowe i spróbuj ponownie.</p>
      
      <button type="button" id="retry">Spróbuj ponownie</button>
      <p class="hint">Strona wróci sama, gdy połączenie zostanie przywrócone.</p>
    </div>
  </main>
  <script>
    document.getElementById('retry').addEventListener('click', () => location.reload());
    window.addEventListener('online', () => location.reload());
  </script>
</body>
</html>
